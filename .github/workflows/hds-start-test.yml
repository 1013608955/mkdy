# hdspace headless 攻关 v11（手动触发）
#
# v10 发现：list 无凭据时 6s 内未发任何 D-Bus 调用（可能先做别的检查）。
# 本版：暴力注入所有合理 service×username 组合到 login 集合（secretstorage
# 已证可写），给 list 足够时长（25s）+ 全程 D-Bus 监听，看它命中哪一项。
#
# 前置 Secrets：HDS_AK / HDS_SK

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage >/dev/null

      - name: 准备
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: 暴力注入候选凭据项 + 长窗监听验证
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf '\n' | gnome-keyring-daemon --start)" || true
          printf 'login' > ~/.local/share/keyrings/default

          HDS_AK="$HDS_AK" HDS_SK="$HDS_SK" python3 - <<'PY'
          import os, secretstorage
          ak, sk = os.environ['HDS_AK'], os.environ['HDS_SK']
          conn = secretstorage.dbus_init()
          col = secretstorage.get_default_collection(conn)
          services = ['hdspace', 'hds', 'csm', 'devenv', 'csmservice',
                      'csmuserservice', 'com.huawei.hdspace', 'hds-csm']
          users = ['hdspace', 'developer', 'csmuser', 'csm_user_name', 'user']
          n = 0
          for s in services:
              for u in users:
                  # 密码存 SK；AK 放进额外属性便于识别
                  col.create_item(f'hds-{s}-{u}',
                                  {'service': s, 'username': u, 'ak': ak},
                                  sk.encode(), replace=True)
                  n += 1
          print(f'已注入 {n} 个候选 item')
          PY

          echo "===== 注入完成，开始 25s 监听窗口内跑 list ====="
          dbus-monitor > /tmp/dbus.log 2>&1 &
          MON=$!
          sleep 1
          timeout 25 ./tools/bin/hdspace-linux devenv list </dev/null >/tmp/list_out.txt 2>&1 || true
          sleep 2; kill $MON 2>/dev/null; sleep 1

          echo "--- list 输出 ---"
          head -12 /tmp/list_out.txt
          echo "--- 命中的 D-Bus 调用 ---"
          grep -aE 'member=(SearchItems|GetSecret|Unlock)' -aA 8 /tmp/dbus.log | head -60
          SESSION
