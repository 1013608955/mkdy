# hdspace headless 攻关 v12（手动触发）
#
# 已实锤链条：config 写入必走 CreateCollection → gcr-prompter GUI 弹窗设密码
#   → 无 display 即死。绕过注入均失败（list 只认 daemon 内部状态）。
#
# v12 终极方案：给 prompter 一个假显示器 + 键盘自动化
#   Xvfb 虚拟屏 + xdotool 监听窗口弹出 → 自动输入密码并回车。
#   这是社区对付 GUI 依赖 CLI 的标准打法。
#
# 前置 Secrets：HDS_AK / HDS_SK

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖（含虚拟显示与键盘自动化）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage xvfb xdotool x11-utils openbox >/dev/null

      - name: 准备
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: Xvfb + 自动应答弹窗 + config/list 全链路
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          # 关键：DISPLAY 必须在进入 dbus-run-session 前设置——
          # dbus-daemon 激活 prompter 用的是 daemon 自身环境，而非调用方环境
          export DISPLAY=:99
          dbus-run-session -- bash -exs <<'SESSION'
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          sleep 2
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf '\n' | gnome-keyring-daemon --start)" || true
          printf 'login' > ~/.local/share/keyrings/default

          # —— 后台自动应答器：按名/类精确搜 gcr 对话框，点击中心拿焦点后键入 ——
          (
            for i in $(seq 1 300); do
              WINS=$( { xdotool search --onlyvisible --name 'gcr' 2>/dev/null; xdotool search --onlyvisible --class 'Gcr' 2>/dev/null; } | sort -u)
              if [ -z "$WINS" ]; then sleep 1; continue; fi
              echo "[autoresponder] cycle$i 命中gcr窗口: $WINS" >&2
              for W in $WINS; do
                eval "$(xdotool getwindowgeometry --shell "$W" 2>/dev/null)"
                xdotool mousemove --window "$W" $((WIDTH/2)) $((HEIGHT/2)) click 1 2>/dev/null
                xdotool windowfocus "$W" 2>/dev/null
                sleep 0.5
                xdotool type --delay 80 'ci-unlock'
                xdotool key Tab
                xdotool type --delay 80 'ci-unlock'
                xdotool key Return
                sleep 3
              done
              sleep 1
            done
          ) &
          AR=$!

          echo "===== pty 驱动 config（弹窗将被自动应答）====="
          timeout 170 python3 tools/config_hds.py || true

          echo "===== X 窗口树（诊断弹窗结构）====="
          DISPLAY=:99 xwininfo -root -tree 2>/dev/null | head -25

          echo "===== devenv list 验证 ====="
          timeout 20 ./tools/bin/hdspace-linux devenv list </dev/null 2>&1 | head -10 && echo "[OK-A] list 有输出" || true

          kill $AR 2>/dev/null
          SESSION

      - name: 若凭据落库则直接验证 start
        if: always()
        run: |
          # 独立会话重读凭据（keyring 文件已持久化在 HOME）
          dbus-run-session -- bash -exs <<'SESSION' || true
          printf '\n' | gnome-keyring-daemon --unlock >/dev/null || true
          printf '\n' | gnome-keyring-daemon --start >/dev/null || true
          ./tools/bin/hdspace-linux devenv list </dev/null 2>&1 | head -8 && echo "[FINAL] 新会话也能读凭据！" || true
          SESSION
