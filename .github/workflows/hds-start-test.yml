# hdspace 在 headless CI 上的可行性实证 v6（手动触发）
#
# 目标：打通「CI 定时唤醒华为云容器」省核时链路的第一环——让 hdspace 在
# headless runner 上读到凭据并完成 config/list/start。
#
# 本版并行两个方案：
#   方案A：python-keyring 官方 README 的 headless canonical 配方原样照抄——
#         dbus-run-session 内 `echo pass | gnome-keyring-daemon --unlock`
#         （keyring 不存在会自动创建 login keyring + default 别名，正是
#         go-keyring 期望的结构；此前我们手工建集合的方式与其不一致）。
#   方案B（兜底+根治）：CI runner 上跑 mitmproxy 透明模式 + 系统 CA，
#         抓 hdspace 的全部出站 TLS 流量拿到明文 API——一旦成功即可用
#         纯 Python 复刻 start/close，彻底摆脱 hdspace/keyring。
#
# 前置 Secrets：HDS_AK / HDS_SK
# 注意：本测试只调 start（幂等），绝不调 close——容器现处常开模式。

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库（含 linux 版 hdspace）
        uses: actions/checkout@v4

      - name: 安装依赖（keyring 栈 + 抓包栈）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 strace mitmproxy >/dev/null
          mitmdump --version

      - name: 准备 hdspace 与 keyring 目录
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: 方案A——canonical 配方（config + list）
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          # python-keyring 官方 README「headless Linux」配方：
          # --unlock 从 stdin 读密码解锁 login keyring；不存在则自动创建。
          echo 'ci-unlock' | gnome-keyring-daemon --unlock >/dev/null
          echo "--- keyring 文件结构 ---"
          ls -la ~/.local/share/keyrings/ 2>/dev/null
          echo "--- secretstorage 视角验证 ---"
          python3 - <<'PY'
          import secretstorage
          conn = secretstorage.dbus_init()
          col = secretstorage.get_default_collection(conn)
          print("default collection:", col.get_label(), "| locked:", col.is_locked())
          PY
          echo "--- pty 驱动 hdspace config（AK/SK/SK确认 三提示）---"
          python3 tools/config_hds.py || true
          echo "--- devenv list 验证凭据读取 ---"
          ./tools/bin/hdspace-linux devenv list && echo "[OK-A] list 成功" || echo "[FAIL-A] list 失败"
          SESSION

      - name: 方案B——mitmproxy 透明抓包（捕获真实 API 明文）
        if: always()
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          mitmdump --mode transparent --listen-port 8080 -w /tmp/hds.flows > /tmp/mitm.log 2>&1 &
          for i in $(seq 1 20); do [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ] && break; sleep 1; done
          sudo cp ~/.mitmproxy/mitmproxy-ca-cert.pem /usr/local/share/ca-certificates/mitmproxy-ca.crt
          sudo update-ca-certificates >/dev/null
          # 出站 443/8443 全部重定向进 mitmproxy（窗口内只有 hdspace 在跑）
          sudo iptables -t nat -A OUTPUT -p tcp -m multiport --dports 443,8443 -j REDIRECT --to-ports 8080

          dbus-run-session -- bash -exs <<'SESSION'
          echo 'ci-unlock' | gnome-keyring-daemon --unlock >/dev/null
          # Go 的 crypto/x509 认 SSL_CERT_FILE，双保险再装系统信任
          export SSL_CERT_FILE="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          python3 tools/config_hds.py || true
          ./tools/bin/hdspace-linux devenv list && echo "[OK-B] list 经代理成功" || echo "[FAIL-B] list 经代理失败"
          SESSION

          sudo iptables -t nat -D OUTPUT -p tcp -m multiport --dports 443,8443 -j REDIRECT --to-ports 8080 2>/dev/null || true
          sleep 2
          pkill -f mitmdump 2>/dev/null || true
          echo "===== 抓到的 HTTP 流量 ====="
          mitmdump -nr /tmp/hds.flows --set flow_detail=1 2>/dev/null | grep -avE "^\s*$" | head -80
          echo "===== mitmproxy 自身日志尾 ====="
          tail -10 /tmp/mitm.log
