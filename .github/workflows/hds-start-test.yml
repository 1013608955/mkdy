# hdspace 在 headless CI 上的可行性实证 v8（手动触发）
#
# v7 发现：ente 配方下 keyring 完全可用（secretstorage 写探针 OK、Login 未锁），
# 但 hdspace 写入仍触发 SystemPrompter 弹窗（无 display 即死）→ 疑似它要
# 创建自己的 collection（建集合必弹窗）或解析 default 别名的方式不同。
#
# v8 三件事：
#   1) default 别名双保险：~/.local/share/keyrings/default 文件 + set_default_collection
#   2) dbus-monitor 全程原始抓取 config 尝试期间的 D-Bus 调用——拿到它
#      操作的精确对象路径/方法/属性后，下一版用 secretstorage 直接替写凭据。
#   3) 修正 strace（去掉非法的 getenv）。
#
# 前置 Secrets：HDS_AK / HDS_SK。只调 start 不调 close。

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库（含 linux 版 hdspace）
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage strace >/dev/null

      - name: 准备
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: keyring 会话 + 别名双保险 + 监听下的 config/list
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf '\n' | gnome-keyring-daemon --start)" || true
          # —— default 别名双保险 ——
          printf 'login' > ~/.local/share/keyrings/default
          python3 -c "
          import secretstorage
          conn = secretstorage.dbus_init()
          col = secretstorage.get_default_collection(conn)
          print('default:', col.get_label(), '| locked:', col.is_locked())
          "
          # —— dbus-monitor 先起，全程监听 ——
          dbus-monitor > /tmp/dbus.log 2>&1 &
          MON=$!
          sleep 1
          python3 tools/config_hds.py || true
          ./tools/bin/hdspace-linux devenv list </dev/null >/dev/null 2>&1 || true
          sleep 1; kill $MON 2>/dev/null
          echo "===== D-Bus 调用序列（config+list 期间全部 method_call）====="
          grep -aE "method (call|return)|member=|path=" /tmp/dbus.log | head -60
          echo "===== 原始日志尾 ====="
          tail -50 /tmp/dbus.log
          echo "===== STRACE 单次 list（修正版）====="
          strace -f -qq -e trace=access,openat,connect -o /tmp/full.log \
            ./tools/bin/hdspace-linux devenv list </dev/null >/dev/null 2>&1 || true
          echo "--- access() 非库探测 ---"
          grep -aE 'access\("' /tmp/full.log | grep -avE '\.so|ENOENT.*lib' | head -15
          echo "--- openat 非库文件 ---"
          grep -aE 'openat\([^"]*"[^"]+"' /tmp/full.log | grep -avE '\.so|locale|/usr/lib|/etc/ld|/proc|/sys/|locale-archive' | head -25
          echo "--- connect ---"
          grep -a 'connect(' /tmp/full.log | head -15
          SESSION
