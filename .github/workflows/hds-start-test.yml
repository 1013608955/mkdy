# hdspace headless 攻关 v9（手动触发）
#
# v8 决定性发现（dbus-monitor 实锤）：hdspace config 的失败链 =
#   OpenSession → CreateCollection（创建自己的集合！）→ Secret.Prompt
#   （建集合须设密码）→ gcr-prompter 无 display 即死 → Object not exist at "/"
#
# v9 目标：抓到 CreateCollection 的完整 body（properties/label），
#   确认它想要的集合名与别名 → 下一版用 secretstorage 预建该集合绕过弹窗。
#   同时试探 secretstorage.create_collection 自身是否也会触发弹窗。
#
# 前置 Secrets：HDS_AK / HDS_SK

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage strace >/dev/null

      - name: 准备
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: 抓 CreateCollection 完整 body
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf '\n' | gnome-keyring-daemon --start)" || true
          printf 'login' > ~/.local/share/keyrings/default

          dbus-monitor > /tmp/dbus.log 2>&1 &
          MON=$!
          sleep 1
          python3 tools/config_hds.py >/tmp/config_out.txt 2>&1 || true
          ./tools/bin/hdspace-linux devenv list </dev/null >/dev/null 2>&1 || true
          sleep 1; kill $MON 2>/dev/null; sleep 1

          echo "===== config 输出 ====="
          cat /tmp/config_out.txt
          echo "===== CreateCollection 上下文原文（前后各18行）====="
          grep -an "CreateCollection" /tmp/dbus.log | head -3
          L=$(grep -an "member=CreateCollection" /tmp/dbus.log | head -1 | cut -d: -f1)
          [ -n "$L" ] && sed -n "$((L-6)),$((L+18))p" /tmp/dbus.log || echo "(未捕获到 CreateCollection)"
          echo "===== ReadAlias/Prompt 上下文 ====="
          L2=$(grep -an "member=Prompt" /tmp/dbus.log | head -1 | cut -d: -f1)
          [ -n "$L2" ] && sed -n "$((L2-4)),$((L2+10))p" /tmp/dbus.log
          echo "===== keyring 文件终态 ====="
          ls -la ~/.local/share/keyrings/

          # ===== 试探：secretstorage.create_collection 是否也弹窗死 =====
          echo "===== secretstorage.create_collection 试探 ====="
          timeout 8 python3 -c "
          import secretstorage
          conn = secretstorage.dbus_init()
          try:
              col = secretstorage.create_collection(conn, 'probe-col', 'ci-unlock')
              print('created:', col.get_label())
              print('items:', len(list(col.get_all_items())))
          except Exception as e:
              print('create_collection failed:', e)
          " || echo "(超时——大概率也是弹窗挂起)"
          SESSION
