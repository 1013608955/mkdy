# hdspace 在 headless CI 上的可行性实证（手动触发）
# 背景：hdspace 凭据存 D-Bus Secret Service keyring，headless 下曾失败
# （2026-08-17 旧记录）。本工作流用 dbus-run-session + gnome-keyring --unlock
# 的标准配方做一次干净重试，验证 config/list 是否可用。
# 若 list 成功 → 后续可加 start/stop 实现「CI 定时唤醒容器」省核时方案。
# 前置 Secrets：HDS_AK / HDS_SK

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库（含 linux 版 hdspace）
        uses: actions/checkout@v4

      - name: 安装 keyring 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 python3-secretstorage >/dev/null

      - name: 准备 hdspace
        run: |
          chmod +x tools/bin/hdspace-linux
          mkdir -p ~/.devenv/logs

      - name: keyring 会话内配置凭据并测试 list
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          chmod +x tools/bin/hdspace-linux
          dbus-run-session -- bash -exs <<'SESSION'
          echo -n "ci-unlock" | gnome-keyring-daemon --unlock --replace > /dev/null 2>&1 || true
          eval "$(echo -n "ci-unlock" | gnome-keyring-daemon --unlock --replace 2>/dev/null | grep GNOME_KEYRING_CONTROL | cut -d= -f2 | sed 's/^/GNOME_KEYRING_CONTROL=/')" || true
          python3 - <<'PY'
          import secretstorage
          conn = secretstorage.dbus_init()
          cols = list(secretstorage.get_all_collections(conn))
          print("collections:", [(c.get_label(), c.is_locked()) for c in cols])
          usable = [c for c in cols if not c.is_locked()]
          if not usable:
              col = secretstorage.create_collection(conn, "login", "ci-unlock")
              print("created collection: login")
              usable = [col]
          try:
              secretstorage.get_default_collection(conn)
              print("default collection OK")
          except Exception as e:
              print("default missing, setting alias:", e)
              secretstorage.set_default_collection(usable[0])
              print("default alias ->", usable[0].get_label())
          PY
          python3 tools/config_hds.py || true
          dbus-monitor > /tmp/dbus.log 2>&1 &
          MON=$!
          ./tools/bin/hdspace-linux devenv list >/dev/null 2>&1 || true
          sleep 1; kill $MON 2>/dev/null
          echo "===== DBUS MONITOR（list 读凭据的真实调用）====="
          grep -aE "method call|member=|path=" /tmp/dbus.log | grep -aiE "secret|collection|item|search" | head -30
          echo "===== 原始尾部 ====="
          tail -40 /tmp/dbus.log
          SESSION

      - name: 测试启动容器（若上步成功）
        if: success()
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          echo -n "ci-unlock" | gnome-keyring-daemon --unlock --replace > /dev/null 2>&1 || true
          ./tools/bin/hdspace-linux devenv start --instance-id=21ce28b8230a43f2ab414327f68bb1a0 && echo "[OK] start 指令已发出"
          SESSION
