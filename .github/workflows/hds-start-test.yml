# hdspace 在 headless CI 上的可行性实证 v7（手动触发）
#
# v6 发现：
#   - 方案A 败于漏装 python3-secretstorage（-e 中止）。
#   - 真正元凶：写 keyring 时 gcr-prompter 要弹 GUI（cannot open display）→
#     "Object does not exist at path /"。v6 用非空密码 unlock 触发弹窗路径。
#   - 方案B 抓包管道已通（流量过代理），但无凭据则零 API 流量。
#
# v7 改动：
#   A) ente#1328 实证配方原样照抄：空密码 unlock（创建 keyring 不走弹窗）
#      + --start 两步式；补装 python3-secretstorage；pty 驱动 config；list 验证。
#   C) 全量 strace 单次 list：不过滤 dump getenv/access/openat/connect，
#      彻底搞清 isSecretServiceAvailable 的判定依据。
#
# 前置 Secrets：HDS_AK / HDS_SK。只调 start 不调 close。

name: hds-start-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库（含 linux 版 hdspace）
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage strace >/dev/null

      - name: 准备
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings

      - name: 方案A——ente 配方（空密码 unlock+start）+ config + list
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          mkdir -p ~/.cache ~/.local/share/keyrings
          # —— ente#1328 实证配方：两步式，空密码 ——
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf '\n' | gnome-keyring-daemon --start)" || true
          echo "--- keyring 文件 ---"
          ls -la ~/.local/share/keyrings/
          echo "--- secretstorage 验证 default collection ---"
          python3 -c "
          import secretstorage
          conn = secretstorage.dbus_init()
          col = secretstorage.get_default_collection(conn)
          print('default:', col.get_label(), '| locked:', col.is_locked())
          col.create_item('probe-item', {'app':'probe'}, b'x', replace=True)
          print('write probe item: OK')
          "
          echo "--- pty 驱动 config ---"
          python3 tools/config_hds.py || true
          echo "--- devenv list ---"
          ./tools/bin/hdspace-linux devenv list && echo "[OK-A] list 成功" || echo "[FAIL-A] list 失败"
          SESSION

      - name: 方案C——全量 strace 单次 list（揪出可用性探测逻辑）
        if: always()
        run: |
          dbus-run-session -- bash -exs <<'SESSION'
          printf '\n' | gnome-keyring-daemon --unlock >/dev/null || true
          printf '\n' | gnome-keyring-daemon --start >/dev/null || true
          strace -f -qq -e trace=getenv,access,openat,connect -o /tmp/full.log \
            ./tools/bin/hdspace-linux devenv list </dev/null >/tmp/list_out.txt 2>&1 || true
          echo "--- list 输出 ---"; head -5 /tmp/list_out.txt
          echo "--- 关键环境变量读取 ---"
          grep -aoE 'getenv\("[A-Z_]+"\)' /tmp/full.log | sort | uniq -c | sort -rn | head -25
          echo "--- access() 探测的路径 ---"
          grep -aE 'access\("' /tmp/full.log | grep -av ENOENT.*\.so | head -20
          echo "--- 打开的非库文件 ---"
          grep -aE 'openat\(.*"' /tmp/full.log | grep -avE '\.so|locale|/usr/lib|/etc/ld|/proc|/sys/|python|locale-archive' | head -30
          echo "--- 全部 connect ---"
          grep -a 'connect(' /tmp/full.log | head -20
          SESSION
