# 验证节点打标（verify-tag）
# 读取 verify_cn/verified.json，在 Clash 订阅里给「已验证可用」节点加 ✅ 前缀，
# 输出独立的 s-verified.yaml（不覆盖被 CI 每小时重生成的 s-clash.yaml）。
name: 验证节点打标（verify-tag）

# P0#1：消除跨工作流时序缺陷。
# 原方案两工作流独立调度（update-subs :00 / verify-tag :15），verify-tag 晚跑导致
# 新验证节点最多延迟 ~1h 才进全量；改为「由 update-subs 推送 s-clash.yaml 后自动触发」，
# 实现零延迟同步（方案 c）。保留 verified.json 触发（FC 直写回仓库）与手动触发。
on:
  workflow_dispatch:         # 保留手动触发
  push:
    paths:
      - 's-clash.yaml'             # update-subs 推送全量订阅后立即打标
      - 'verify_cn/verified.json'  # FC 直写回仓库时立即打标

# 与「订阅合并（单源）」共用并发组，避免两者同时推送 main 导致 non-fast-forward 拒绝
concurrency:
  group: mkdy-subs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # 复用仓库已有的 PAT（具备 push 权限）
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install pyyaml

      - name: 打标（生成 s-verified.yaml）
        run: python verify_cn/tag_verified.py

      - name: 提交 s-verified.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add s-verified.yaml s-verified.txt
          if git diff --cached --quiet; then
            echo "[INFO] s-verified.yaml 无变化，跳过提交"
          else
            git commit -m "chore: 更新已验证节点标记 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M 北京时间')"
            # 防止与容器 run_local.py / update-subs.yml 并发推送竞争 main 导致 non-fast-forward 拒绝
            git fetch origin main
            git merge origin/main --no-edit --no-ff
            git push
          fi
