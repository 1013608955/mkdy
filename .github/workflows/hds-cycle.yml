# hds-cycle — CI 定时唤醒华为云容器跑验证（省核时方案生产链路）v2
#
# 架构：config 一次（Xvfb+openbox+xdotool 应答 gcr 弹窗）→ 之后每条 hdspace
#   命令用 tools/hds_session.sh 独立短会话执行（互不影响、close 必达）。
#
# 三模式：status=查状态 | wake=仅开机 | wake_verify=开机+SSH验证+关机
# 前置 Secrets：HDS_AK / HDS_SK / HDS_SSH_KEY（容器 root 私钥全文）

name: hds-cycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status=查状态 | wake=仅开机 | wake_verify=开机+验证+关机"
        default: "wake_verify"
        type: choice
        options: [status, wake, wake_verify]
      instance_id:
        default: "21ce28b8230a43f2ab414327f68bb1a0"

env:
  INSTANCE: "21ce28b8230a43f2ab414327f68bb1a0"

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage xvfb xdotool openbox >/dev/null

      - name: 准备（hdspace / SSH key / Xvfb）
        env:
          HDS_SSH_KEY: ${{ secrets.HDS_SSH_KEY }}
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py \
                   tools/hds_session.sh tools/boot_job.sh
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings ~/.ssh
          printf '%s\n' "$HDS_SSH_KEY" > ~/.ssh/hds_key
          chmod 600 ~/.ssh/hds_key
          nohup Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          (echo > /dev/tcp/127.0.0.1/6099) 2>/dev/null || true

      - name: "[1] 首次写入凭据（含 gcr 弹窗自动应答）"
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          export DISPLAY=:99
          dbus-run-session -- bash -exs <<'SESSION'
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          sleep 2
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --start)" || true
          (
            for i in $(seq 1 200); do
              WINS=$( { xdotool search --onlyvisible --name 'gcr' 2>/dev/null;
                        xdotool search --onlyvisible --class 'Gcr' 2>/dev/null; } | sort -u)
              if [ -z "$WINS" ]; then sleep 1; continue; fi
              echo "[autoresponder] cycle$i 命中gcr窗口: $WINS" >&2
              for W in $WINS; do
                eval "$(xdotool getwindowgeometry --shell "$W" 2>/dev/null)"
                xdotool mousemove --window "$W" $((WIDTH/2)) $((HEIGHT/2)) click 1 2>/dev/null
                xdotool windowfocus "$W" 2>/dev/null
                sleep 0.5
                xdotool type --delay 80 'ci-unlock'
                xdotool key Tab
                xdotool type --delay 80 'ci-unlock'
                xdotool key Return
                sleep 3
              done
              sleep 1
            done
          ) &
          AR=$!
          timeout 170 python3 tools/config_hds.py || true
          kill $AR 2>/dev/null
          SESSION

      - name: "[2] 查状态 + 按需开机"
        run: |
          STATE=$(tools/hds_session.sh devenv list </dev/null 2>&1 | tee /tmp/state.txt | grep -oE "Running|Ready|Starting|Closing" | head -1)
          echo "当前状态: ${STATE:-未知}"
          if [ "${{ inputs.action || 'wake_verify' }}" = "status" ]; then
            echo "[done] status 模式完成"; exit 0
          fi
          if [ "$STATE" != "Running" ]; then
            tools/hds_session.sh devenv start --instance-id="$INSTANCE" </dev/null 2>&1 | head -3
            for i in $(seq 1 20); do
              sleep 15
              STATE=$(tools/hds_session.sh devenv list </dev/null 2>&1 | grep -oE "Running|Ready|Starting|Closing" | head -1)
              echo "  [$i] 状态=$STATE"
              [ "$STATE" = "Running" ] && break
            done
          fi
          [ "$STATE" = "Running" ] || { echo "[ERR] 容器未能进入 Running"; exit 1; }

          echo "===== 重置并获取 SSH 私钥（需容器开机）====="
          echo yes | tools/hds_session.sh devenv ssh-key-reset --instance-id="$INSTANCE" > /tmp/reset.log 2>&1 || true
          echo "--- reset 输出尾 ---"
          tail -5 /tmp/reset.log

          if [ "${{ inputs.action || 'wake_verify' }}" = "wake" ]; then
            echo "[done] 仅开机模式，保持 Running"; exit 0
          fi

      - name: "[3] 开隧道 + 分离执行容器验证 + 轮询结果"
        timeout-minutes: 14
        run: |
          HDS_NO_TIMEOUT=1 tools/hds_session.sh devenv start-tunnel \
            --instance-id="$INSTANCE" --ports=10022:22 >/tmp/tunnel.log 2>&1 &
          TUN=$!
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/10022) 2>/dev/null && break
            sleep 2
          done
          sleep 2
          echo "--- 近 5 分钟 .devenv 新增文件 ---"
          find "$HOME/.devenv" -type f -newermt '-5 minutes' 2>/dev/null
          # reset 成功后私钥固定生成在 ~/.devenv/.ssh/IdentityFile/<实例ID>
          KEYFILE="$HOME/.devenv/.ssh/IdentityFile/$INSTANCE"
          echo "KEYFILE=$KEYFILE"
          [ -n "$KEYFILE" ] || { echo "[ERR] 私钥未找到"; exit 1; }
          chmod 600 "$KEYFILE"
          chmod 600 "$KEYFILE"
          SSH="ssh -p 10022 -i $KEYFILE -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10 -o BatchMode=yes root@127.0.0.1"
          # 上传引导脚本并分离启动（输出落容器持久盘，连接断开不影响）
          $SSH "cat > /tmp/boot_job.sh && chmod +x /tmp/boot_job.sh && \
                rm -f /workspace/mkdy/verify_cn/logs/ci_boot.log && \
                nohup /tmp/boot_job.sh > /workspace/mkdy/verify_cn/logs/ci_boot.log 2>&1 & \
                sleep 1; echo LAUNCHED" < tools/boot_job.sh
          DONE=""
          for i in $(seq 1 27); do
            sleep 20
            TAIL=$($SSH "tail -3 /workspace/mkdy/verify_cn/logs/ci_boot.log 2>/dev/null" 2>/dev/null || true)
            echo "--- poll$i: ${TAIL##*$'\n'}"
            case "$TAIL" in *"[boot_job] done"*) DONE=1; break;; esac
          done
          if [ -z "$DONE" ]; then
            echo "[ERR] boot_job 未在时限内完成"
            $SSH "tail -25 /workspace/mkdy/verify_cn/logs/ci_boot.log 2>/dev/null" || true
            exit 1
          fi
          echo "===== boot_job 结果 ====="
          $SSH "cat /workspace/mkdy/verify_cn/logs/ci_boot.log"

      - name: "[4] 关机（无论成败必执行）"
        if: always()
        run: |
          tools/hds_session.sh devenv stop --instance-id="$INSTANCE" </dev/null 2>&1 | head -3
          echo "[done] 已发出关机指令"

      - name: "[5] 复核最终状态"
        if: always()
        run: |
          sleep 30
          tools/hds_session.sh devenv list </dev/null 2>&1 | head -6 || true
