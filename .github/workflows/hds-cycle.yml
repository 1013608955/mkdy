# hds-cycle — CI 定时唤醒华为云容器跑验证（省核时方案生产链路）v2
#
# 架构：config 一次（Xvfb+openbox+xdotool 应答 gcr 弹窗）→ 之后每条 hdspace
#   命令用 tools/hds_session.sh 独立短会话执行（互不影响、close 必达）。
#
# 三模式：status=查状态 | wake=仅开机 | wake_verify=开机+SSH验证+关机
# 前置 Secrets：HDS_AK / HDS_SK / HDS_SSH_KEY（容器 root 私钥全文）

name: hds-cycle

on:
  schedule:
    - cron: '23 * * * *'        # 每小时兜底：主力触发已改为华为云 FunctionGraph 每15分钟调 workflow_dispatch
                                # （GitHub 免费档 schedule 高峰期严重延迟，实测 */15 实际间隔 25~100 分钟）
  workflow_dispatch:
    inputs:
      action:
        description: "status=查状态 | wake=仅开机 | wake_verify=开机+验证+关机"
        default: "wake_verify"
        type: choice
        options: [status, wake, wake_verify]
      instance_id:
        default: "21ce28b8230a43f2ab414327f68bb1a0"

env:
  INSTANCE: "21ce28b8230a43f2ab414327f68bb1a0"

concurrency:
  group: hds-cycle
  cancel-in-progress: false   # 上一轮未结束时新轮排队等待，绝不并行操作容器

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: "防重入门卫：存在排队/运行中的更新轮次则空转退出（省核时）"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # concurrency(FIFO) 保证本运行拿到执行权时，其余未完成轮次必然全部比本次新
          # ——它们会产出更新的验证结果，本次属冗余触发（外部 dispatch 与迟到 schedule
          # 撞车时出现），直接空转退出即可，不必再跑完整容器流程。
          OTHERS=$(gh api "repos/${{ github.repository }}/actions/workflows/hds-cycle.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.id != $rid) | select(.status == "in_progress" or .status == "queued")] | length' \
            --arg rid "${{ github.run_id }}" 2>/dev/null || echo 0)
          if [ "${OTHERS:-0}" -gt 0 ] 2>/dev/null; then
            echo "[skip] 检测到 $OTHERS 个更新的轮次在排队/运行中，本次冗余，空转退出。"
            exit 0
          fi
          echo "[pass] 无冗余轮次，继续执行。"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage xvfb xdotool openbox >/dev/null

      - name: 准备（hdspace / SSH key / Xvfb）
        env:
          HDS_SSH_KEY: ${{ secrets.HDS_SSH_KEY }}
        run: |
          chmod +x tools/bin/hdspace-linux tools/config_hds.py \
                   tools/hds_session.sh tools/boot_job.sh
          mkdir -p ~/.devenv/logs ~/.cache ~/.local/share/keyrings ~/.ssh
          printf '%s\n' "$HDS_SSH_KEY" > ~/.ssh/hds_key
          chmod 600 ~/.ssh/hds_key
          nohup Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          (echo > /dev/tcp/127.0.0.1/6099) 2>/dev/null || true

      - name: "[1] 首次写入凭据（含 gcr 弹窗自动应答）"
        env:
          HDS_AK: ${{ secrets.HDS_AK }}
          HDS_SK: ${{ secrets.HDS_SK }}
        run: |
          export DISPLAY=:99
          dbus-run-session -- bash -exs <<'SESSION'
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          sleep 2
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --start)" || true
          (
            for i in $(seq 1 200); do
              WINS=$( { xdotool search --onlyvisible --name 'gcr' 2>/dev/null;
                        xdotool search --onlyvisible --class 'Gcr' 2>/dev/null; } | sort -u)
              if [ -z "$WINS" ]; then sleep 1; continue; fi
              echo "[autoresponder] cycle$i 命中gcr窗口: $WINS" >&2
              for W in $WINS; do
                eval "$(xdotool getwindowgeometry --shell "$W" 2>/dev/null)"
                xdotool mousemove --window "$W" $((WIDTH/2)) $((HEIGHT/2)) click 1 2>/dev/null
                xdotool windowfocus "$W" 2>/dev/null
                sleep 0.5
                xdotool type --delay 80 'ci-unlock'
                xdotool key Tab
                xdotool type --delay 80 'ci-unlock'
                xdotool key Return
                sleep 3
              done
              sleep 1
            done
          ) &
          AR=$!
          timeout 170 python3 tools/config_hds.py || true
          kill $AR 2>/dev/null
          SESSION

      - name: "[2] 查状态 + 按需开机（2 次尝试 · 共享轮询预算 · 僵死态恢复 · 无算力跳过）"
        run: |
          # A. 状态枚举补全：以 hdspace list 真实返回为准（本机实测含 Stopping/Stopped，原模式漏列）
          STATES="Running|Ready|Starting|Stopping|Stopped|Closing|Error"
          # get_state 仅从本实例所在表格行解析状态；若 devenv list 自身失败(输出含 Error 字样但无实例行)
          # 则返回空，避免把 CLI 报错误判为实例 Error 态而直接放弃（run 381 误判根因）
          get_state() {
            tools/hds_session.sh devenv list </dev/null 2>&1 \
              | grep -F "$INSTANCE" | grep -oE "$STATES" | head -1
          }

          # B. 统一的 start 调用：保留真实返回码 + 完整输出（僵死态恢复需要调两次，故抽成函数）。
          #    原写法 `cmd 2>&1 | tail -3` 有两个致命缺陷：
          #    ① 管道退出码取自**最后一个命令 tail**（恒为 0），if 判断形同虚设
          #       —— start 真的失败也会永远打印 "[ok] start 返回 0"；
          #    ② 2>&1 把 hds_session.sh 的 set -x 跟踪行一并灌进管道，
          #       而 tail -3 只剩最后 3 行，恰好全是被合并进来的跟踪行
          #       （+ RC=0 / + kill / + exit 0），hdspace 的真实输出被整段丢弃。
          #    后果：2026-09-04 02:00-03:55 连续 5 轮容器起不来，
          #       日志里没有一行平台侧线索，完全无法定位。
          #    现改为：stdout/stderr 分开落临时文件，rc 取 $? 并作为返回值，输出全量打印。
          START_MSG=""   # do_start 捕获的平台 stdout（无算力等关键报错在这里）
          do_start() {
            local out err rc
            out=$(mktemp); err=$(mktemp)
            tools/hds_session.sh devenv start --instance-id="$INSTANCE" </dev/null \
              > "$out" 2> "$err"
            rc=$?
            echo "--- start rc=$rc | stdout ---"
            cat "$out"
            echo "--- start stderr 尾 15 行（含 set -x 跟踪）---"
            tail -15 "$err"
            START_MSG=$(cat "$out")
            rm -f "$out" "$err"
            return $rc
          }

          if [ "${{ inputs.action || 'wake_verify' }}" = "status" ]; then
            echo "当前状态: $(get_state)"; echo "[done] status 模式完成"; exit 0
          fi

          STATE=$(get_state); echo "初始状态: ${STATE:-未知(list 可能瞬时失败)}"
          RECOVERED=0   # 僵死态恢复（stop→start）每轮只允许一次，避免反复折腾容器
          LAST_NOCOMPUTE=0   # 跨尝试记忆：最后一次 start 是否被平台回复无算力（决定最终按跳过还是报错）
          for attempt in 1 2; do
            BUDGET=20   # 本轮「探测+等待」共享的轮询次数预算（见下，保证最坏耗时不增加）
            NOCOMPUTE=0   # 平台明确回复无算力时置 1（仅本轮有效）
            if [ "$STATE" = "Running" ]; then echo "[ok] 已进入 Running"; break; fi

            # 过渡态只轮询等待；真实 Error 视为可能瞬时，等待恢复而非立即放弃；
            # 空(状态未知/list 失败)与稳定非运行态(Ready/Stopped/Closing)才发 start
            case "$STATE" in
              Running|Starting|Stopping) echo "[info] 过渡态 $STATE，仅等待";;
              Error) echo "[warn] 实例 Error（可能瞬时），等待恢复，不立即放弃";;
              *)
                PRE="$STATE"
                LAST_NOCOMPUTE=0
                echo "[start] 第 $attempt/2 次开机（当前态=${STATE:-未知}）"
                if do_start; then
                  echo "[ok] start 返回 0"
                else
                  echo "[warn] start 返回非 0（平台限流/瞬时故障），将重试"
                fi

                # D. 无算力快速失败（run #957 根因：平台 stdout 明确回复
                #    "No compute resources are available for the current specifications"）。
                #    两个关键事实：① hdspace CLI 此种失败仍退出 0，返回码查不出来，
                #    只能认 stdout 文本；② 无算力时状态不可能自行迁移到 Running
                #    （必须 start 真正成功），探测/长轮询纯属空转——实测 #957 里
                #    13 分钟的全部轮询都停在 Ready。
                #    故跳过探测窗与长轮询（也跳过僵死态恢复——它治的是状态卡死，
                #    治不了没资源），短等 60s 后直接重试 start；失败一轮从 ~13.7min
                #    压到 ~2.5min，且日志出现 [nocompute] 一眼定性。
                case "$START_MSG" in
                  *"No compute resources"*)
                    NOCOMPUTE=1
                    LAST_NOCOMPUTE=1
                    echo "[nocompute] 平台回复无算力（No compute resources）——跳过状态轮询，短等 60s 后重试 start"
                    ;;
                esac
                if [ "$NOCOMPUTE" = "1" ]; then
                  sleep 60
                  STATE=$(get_state)
                  echo "[nocompute] 短等后复查状态=${STATE:-未知}"
                  continue
                fi

                # C. 探测 start 是否真的生效（2026-09-04 连续 5 轮起不来的对策）
                #    故障特征：start 返回 0，但 60s 内状态连 Starting 都没出现过、
                #    纹丝不动停在 Ready → 平台接受了请求却没真正分配资源。
                #    此时再原样重试 start 只是无效 no-op（原逻辑连试 3 次全是 no-op，
                #    空耗 19-20 分钟后失败），必须先 stop 清一次僵死态。
                MOVED=""
                for k in 1 2 3 4; do
                  sleep 15
                  STATE=$(get_state); BUDGET=$((BUDGET-1))
                  echo "  [probe$k] 状态=$STATE"
                  if [ "$STATE" != "$PRE" ] || [ "$STATE" = "Running" ]; then MOVED=1; break; fi
                done

                # 恢复动作：先 stop 清僵死态，再 start。
                # 三道护栏，缺一不可：
                #   ① 仅在「确实没动」(MOVED 为空) 且「本轮没恢复过」时才执行；
                #   ② 动手前**重新** get_state 复检，只对稳定非运行态(Ready/Stopped/Closing)发 stop；
                #      Running/Starting/Stopping 一律跳过——否则会把正在用/正在起的容器掐掉；
                #   ③ RECOVERED 标志确保每轮最多清一次，不反复折腾。
                if [ -z "$MOVED" ] && [ "$RECOVERED" -eq 0 ]; then
                  NOW=$(get_state)
                  case "$NOW" in
                    Ready|Stopped|Closing)
                      RECOVERED=1
                      echo "[recover] start 已接受但 60s 内状态未动（停在 $NOW），判定僵死态：先 stop 再 start 清一次"
                      if tools/hds_session.sh devenv stop --instance-id="$INSTANCE" </dev/null 2>&1 | tail -5; then
                        echo "[recover] stop 已发出"
                      else
                        echo "[recover][warn] stop 返回非 0（仍继续尝试 start）"
                      fi
                      sleep 10
                      echo "[recover] 重新开机（当前态=$(get_state)）"
                      if do_start; then
                        echo "[recover] start 返回 0"
                      else
                        echo "[recover][warn] start 返回非 0"
                      fi
                      ;;
                    *)
                      echo "[recover][skip] 复检状态=${NOW:-未知}，非稳定非运行态，不发 stop（避免误伤）"
                      ;;
                  esac
                fi
                ;;
            esac

            if [ "$STATE" = "Running" ]; then echo "[ok] 已进入 Running"; break; fi

            # 轮询等待进入 Running；Error/未知 仅继续等待，不立即失败（容错瞬时异常）。
            # 预算共享：探测窗消耗的次数从 20 里扣除，每轮总轮询次数恒 ≤20 ——
            # 每次轮询实测 ≈19s（sleep 15 + get_state≈4s），若探测不扣预算，
            # 失败路径最坏耗时会从 ~19.3min 涨到 ~23.6min（我自己刚引入的回归）。
            for i in $(seq 1 $BUDGET); do
              sleep 15
              STATE=$(get_state)
              echo "  [$i] 状态=$STATE"
              if [ "$STATE" = "Running" ]; then echo "[ok] 已进入 Running"; break; fi
            done
            if [ "$STATE" = "Running" ]; then echo "[ok] 已进入 Running"; break; fi
            echo "[retry] 第 $attempt 次未进入 Running，准备重试"
          done
          if [ "$STATE" != "Running" ]; then
            # 平台「无算力」是区域性瞬时故障（如 2026-09-04 05:00-06:45 连续 8 轮），
            # 下轮 15 分钟后自动重试即可恢复。若也标 failure，GitHub 每轮都发失败邮件
            # （用户收件箱被刷屏）。故 2 次尝试均被回复无算力时按「本轮跳过」处理：
            # exit 0 + NOCOMPUTE_SKIP 标记（[3] 据此跳过），[4]/[5] 照常收尾，[6] 不触发。
            if [ "$LAST_NOCOMPUTE" = "1" ]; then
              echo "[nocompute] 平台持续无算力（2 次尝试均被拒），本轮按跳过处理，不告警；下轮自动重试。"
              echo "NOCOMPUTE_SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "[ERR] 容器未能进入 Running（最终态=${STATE:-未知}）"
            exit 1
          fi

          echo "===== 重置并获取 SSH 私钥（需容器开机）====="
          echo yes | tools/hds_session.sh devenv ssh-key-reset --instance-id="$INSTANCE" > /tmp/reset.log 2>&1 || true
          echo "--- reset 输出尾 ---"
          tail -5 /tmp/reset.log

          if [ "${{ inputs.action || 'wake_verify' }}" = "wake" ]; then
            echo "[done] 仅开机模式，保持 Running"; exit 0
          fi

      - name: "[2b] 无算力连续多轮兜底告警（仅跳过轮执行；每轮风暴只提醒一次）"
        if: env.NOCOMPUTE_SKIP == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 兜底：无算力单轮跳过不告警（瞬时故障，下轮自愈），但若连续 N 轮都被跳过，
          # 说明平台算力短缺持续数小时，值得提醒一次。计数不落盘：无算力跳过轮的
          # 唯一签名 = conclusion=success 且 [3] 步骤 skipped（正常轮 [3] 必然执行；
          # failure 轮的 [3] skipped 是默认 success() 条件所致，用 success 排除）。
          # 只提醒一次的保证：条件取 CONSEC == N（正好等于阈值才发），风暴继续则
          # N+1、N+2…不再发；算力恢复后连击自然清零，下次风暴重新计。
          N=8   # 连续无算力跳过阈值（15 分钟一轮 → 8 轮 ≈ 持续 2 小时）
          REPO="${{ github.repository }}"
          SELF="${{ github.run_id }}"
          CONSEC=0
          while read -r rid rstatus rconcl; do
            [ -z "$rid" ] && continue
            [ "$rid" = "$SELF" ] && continue          # 本轮自身尚未完成，不计入
            [ "$rstatus" != "completed" ] && continue  # 排队/运行中的更新轮次：不计入不打断
            if [ "$rconcl" != "success" ]; then
              [ "$rconcl" = "cancelled" ] && continue  # 被取消的轮次无信息量：不计入不打断
              break                                     # 真失败/其他结论：连击打断
            fi
            S3=$(gh api "repos/$REPO/actions/runs/$rid/jobs" \
              --jq '[.jobs[0].steps[] | select(.name | startswith("[3]"))][0].conclusion // "none"' 2>/dev/null || echo none)
            if [ "$S3" = "skipped" ]; then
              CONSEC=$((CONSEC+1))
            else
              break
            fi
          done < <(gh api "repos/$REPO/actions/workflows/hds-cycle.yml/runs?per_page=20" \
                     --jq '.workflow_runs[] | [.id, .status, .conclusion] | @tsv')
          echo "连续无算力跳过轮数: $CONSEC（阈值 $N）"
          [ "$CONSEC" -eq "$N" ] || { echo "[skip] 未达阈值，不告警"; exit 0; }

          MSG="mkdy 容器已连续 $N 轮（约 $((N*15/60)) 小时+）无算力被跳过。平台算力持续短缺，请关注华为云区域容量或考虑更换规格。最近一次: $RUN_URL"
          if [ -n "$SERVERCHAN_KEY" ]; then
            curl -s --max-time 15 -o /dev/null               "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send?title=mkdy连续无算力&desp=$(printf %s "$MSG" | sed s/&/%26/g)" || true
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s --max-time 15 -o /dev/null               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage"               -d chat_id="$TG_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "[alert] 已发送连续无算力兜底告警"

      - name: "[3] 开隧道 + 分离执行容器验证 + 轮询结果"
        if: env.NOCOMPUTE_SKIP != '1'   # [2] 判定平台无算力已跳过本轮：容器没开，隧道/验证无从谈起
        timeout-minutes: 14
        run: |
          # 诊断留痕：stdout/stderr 改行缓冲，被 kill 也不丢最后一行
          exec > >(stdbuf -oL cat) 2> >(stdbuf -eL cat)

          # 全局预算：本步骤所有阶段共用一个硬上限，任何阶段都不得吃满 14 分钟。
          # 2026-09-02 run#812 教训：旧 DEADLINE 设在「上传命令」之后，上传一旦卡死，
          # 轮询循环连同硬上限永远轮不到执行，步骤被 14min 超时强杀且毫无 [ERR]/[warn] 留痕。
          T0=$(date +%s)
          DEADLINE=$(( T0 + 660 ))
          left() { echo $(( DEADLINE - $(date +%s) )); }
          # 统一 SSH 入口：外置 timeout 兜底。ConnectTimeout/ServerAlive 只能发现「传输层已死」，
          # 拦不住「sshd 活着但会话通道不 EOF / ssh 阻塞在写」这类卡死，故每条 SSH 必须显式 timeout。
          ssh_run() {            # ssh_run <上限秒> <远端命令...>
            local lim="$1"; shift
            local l; l=$(left)
            [ "$l" -lt "$lim" ] && lim=$l
            if [ "$lim" -le 5 ]; then echo "[timeout] 全局预算耗尽，跳过本次 SSH"; return 1; fi
            timeout -k 5 "$lim" ssh -p 10022 -i "$KEYFILE" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
              -o ConnectTimeout=10 -o BatchMode=yes root@127.0.0.1 "$@"
          }

          HDS_NO_TIMEOUT=1 tools/hds_session.sh devenv start-tunnel \
            --instance-id="$INSTANCE" --ports=10022:22 >/tmp/tunnel.log 2>&1 &
          TUN=$!
          echo "[tunnel] 等待端口 10022（预算内 $(left)s）"
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/10022) 2>/dev/null && break
            [ $(left) -lt 90 ] && { echo "[ERR] 隧道端口 10022 迟迟未通且预算不足"; break; }
            sleep 2
          done
          sleep 2
          echo "--- 近 5 分钟 .devenv 新增文件 ---"
          find "$HOME/.devenv" -type f -newermt '-5 minutes' 2>/dev/null
          # reset 成功后私钥固定生成在 ~/.devenv/.ssh/IdentityFile/<实例ID>
          KEYFILE="$HOME/.devenv/.ssh/IdentityFile/$INSTANCE"
          echo "KEYFILE=$KEYFILE"
          [ -n "$KEYFILE" ] || { echo "[ERR] 私钥未找到"; exit 1; }
          chmod 600 "$KEYFILE"

          # 上传并真正分离启动 boot_job（关键修正，run#812 根因）：
          #  - 旧写法 `A && B && C && D &` 因 & 优先级低于 &&，整条链（含 cat）被丢后台，
          #    `sleep 1; echo LAUNCHED` 与它并发 → LAUNCHED 不代表真启动了；
          #  - nohup 只在 stdin 是终端时才把它重定向 /dev/null；此处 stdin 是 SSH 通道（非 tty），
          #    boot_job 会继承通道 → sshd 通道无法 EOF → 本次 SSH 阻塞到 boot_job 跑完
          #    （正常 4~7min，慢窗 >14min 就撑爆步骤上限，且 ConnectTimeout/ServerAlive 拦不住）。
          #  - 改用 `( nohup ... < /dev/null & )`：subshell 立即返回、子进程被 init 接管，
          #    三路 IO 全部脱离 SSH 通道，本次 SSH 秒回；远端若 setsid 可用则更干净（nohup 已够）。
          LOG=/workspace/mkdy/verify_cn/logs/ci_boot.log
          echo "[upload] 上传并分离启动 boot_job.sh（预算内 $(left)s）..."
          ssh_run 90 "mkdir -p /workspace/mkdy/verify_cn/logs && cat > /tmp/boot_job.sh && \
                chmod +x /tmp/boot_job.sh && rm -f $LOG && \
                ( nohup /tmp/boot_job.sh > $LOG 2>&1 < /dev/null & ) && \
                sleep 2 && { [ -e $LOG ] && echo LAUNCHED || echo NOT_LAUNCHED; }" \
            < tools/boot_job.sh

          echo "[poll] 开始轮询 ci_boot.log（全局预算 $(left)s）"
          DONE=""
          for i in $(seq 1 60); do
            [ $(left) -lt 60 ] && { echo "[warn] 全局预算不足，停止轮询"; break; }
            sleep 20
            echo "[poll$i] SSH 探测（剩余 $(left)s）..."
            TAIL=$(ssh_run 30 "tail -3 $LOG 2>/dev/null" 2>/dev/null || true)
            echo "--- poll$i: ${TAIL##*$'\n'}"
            case "$TAIL" in *"[boot_job] done"*) DONE=1; break;; esac
          done
          if [ -z "$DONE" ]; then
            echo "[ERR] boot_job 未在时限内完成"
            ssh_run 60 "tail -40 $LOG 2>/dev/null" || true
            exit 1
          fi
          echo "===== boot_job 结果 ====="
          ssh_run 120 "cat $LOG"

      - name: "[4] 关机（无论成败必执行）"
        if: always()
        run: |
          tools/hds_session.sh devenv stop --instance-id="$INSTANCE" </dev/null 2>&1 | head -3
          echo "[done] 已发出关机指令"

      - name: "[5] 复核最终状态"
        if: always()
        run: |
          sleep 30
          tools/hds_session.sh devenv list </dev/null 2>&1 | head -6 || true

      - name: "[6] 失败告警（配置了对应 Secret 才发送）"
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="mkdy 容器周期失败，请查看: $RUN_URL"
          if [ -n "$SERVERCHAN_KEY" ]; then
            curl -s --max-time 15 -o /dev/null               "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send?title=mkdy容器周期失败&desp=$(printf %s "$MSG" | sed s/&/%26/g)" || true
          fi
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s --max-time 15 -o /dev/null               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage"               -d chat_id="$TG_CHAT_ID" --data-urlencode text="$MSG" || true
          fi
          echo "告警步骤完成（未配置 Secret 时为空操作）"
