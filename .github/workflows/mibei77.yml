name: Fetch Mibei77 & Datiya Nodes

on:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时执行一次
  workflow_dispatch:  # 保留手动触发功能

# 同一工作流禁止并发运行，避免 force-with-lease 推送互相干扰
concurrency:
  group: mkdy-mibei77
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run fetch script
        run: python fetch.py

      - name: 统一推送生成的订阅文件（单提交）
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # 暂存本次生成的文件：s2.txt（合并节点）、s2-clash-1.yaml（米贝77）、s2-clash-2.yaml（Datiya）
          git add s2.txt s2-clash-1.yaml s2-clash-2.yaml
          # 方案A：仅当有变更时才改写单条提交并推送，避免历史膨胀；force-with-lease 防覆盖他人推送
          if git diff --cached --quiet; then
            echo "生成物无变更，跳过推送"
          else
            git commit --amend --no-edit
            git push --force-with-lease
            echo "生成物已以单提交方式更新并推送"
          fi
