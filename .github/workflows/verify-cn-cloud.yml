name: verify-cn-cloud

on:
  schedule:
    # 每 15 分钟触发一次；默认 VERIFY_MAX_AGE_MIN=0 → 每次触发都拉起云容器验证并关机。
    # 如需省核时，在仓库 Variables 设 VERIFY_MAX_AGE_MIN 为正整数（如 180）改回「陈旧才开机」模式。
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略新鲜度阈值，强制拉起云容器验证一次'
        required: false
        default: 'false'
      debug_keyring:
        description: '仅验证 keyring 凭据后端可用即退出（不真开机，省核时）'
        required: false
        default: 'false'

concurrency:
  group: verify-cn-cloud
  cancel-in-progress: false

permissions:
  contents: read   # 仅检出仓库；推送由容器内 GITHUB_PAT 完成

jobs:
  cloud-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Control Huawei Cloud dev env (start → verify → stop)
        env:
          HW_INSTANCE_ID:  ${{ secrets.HW_INSTANCE_ID }}
          HW_AK:           ${{ secrets.HW_AK }}
          HW_SK:           ${{ secrets.HW_SK }}
          HW_GITHUB_PAT:   ${{ secrets.HW_GITHUB_PAT }}
          HW_SSH_USER:     ${{ secrets.HW_SSH_USER }}
          HW_REGION:       ${{ secrets.HW_REGION }}
          VERIFY_MAX_AGE_MIN: ${{ vars.VERIFY_MAX_AGE_MIN }}
          FORCE:           ${{ github.event.inputs.force }}
          CI_DEBUG_KEYRING: ${{ github.event.inputs.debug_keyring }}
        run: bash verify_cn/cloud_control.sh
