name: Update tuijianvpn Subscription

on:
  schedule:
    - cron: '15 */1 * * *'      # 每 1 小时的第 15 分钟执行（可改成 '*/10 * * * *' 每10分钟，但注意 GitHub 配额）
  workflow_dispatch:            # 允许手动触发测试

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and save latest subscription
        run: python fetch_tuijian.py

      - name: Commit changes if content updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A
          # 只在有实质变化时才 commit，避免无意义推送
          git diff --staged --quiet || git commit -m "Update tuijianvpn subscription $(date +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
