# 建议将此文件命名为：update-nodes-and-clash.yml（无空格，避免解析错误）
name: 节点更新 + Clash配置转换（每1小时）

on:
  schedule:
    - cron: '0 */1 * * *'  # 每1小时执行一次
  workflow_dispatch:       # 保留手动触发

# 全局环境变量（移除循环引用，仅保留无依赖的核心配置）
env:
  SUB_CONTAINER_NAME: subconverter-temp    # 临时容器名（便于清理）
  GIT_USER_NAME: github-actions[bot]       # Git提交用户名
  GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com  # Git提交邮箱

# 同一工作流禁止并发运行，避免 force-with-lease 推送互相干扰
concurrency:
  group: mkdy-nodes-clash
  cancel-in-progress: false

jobs:
  update-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # 精准设置超时（优化后流程≤5分钟）
    steps:
      # ========== 第一步：检出仓库代码（带PAT权限，避免推送失败） ==========
      - name: 🔍 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT_TOKEN }}  # 替换为你的PAT令牌（仓库设置中配置）
          persist-credentials: true
          fetch-depth: 1  # 仅拉取最新提交，提升运行速度

      # ========== 第二步：更新s1.txt（节点更新核心逻辑） ==========
      - name: 🐍 设置Python环境（避免缓存报错）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 移除cache: 'pip'，跳过依赖文件检查'

      - name: 📦 安装Python依赖
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install requests
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') Python依赖安装完成"

      - name: 🚀 运行节点更新脚本（生成最新s1.txt）
        run: |
          set -euo pipefail
          # 检查脚本是否存在，避免运行失败
          if [ ! -f "update_nodes.py" ]; then
            echo "[ERROR] $(date +'%Y-%m-%d %H:%M:%S') update_nodes.py文件不存在，终止流程"
            exit 1
          fi
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 开始运行节点更新脚本..."
          python update_nodes.py
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 节点更新脚本运行完成"
        env:
          PYTHONUNBUFFERED: "1"  # 实时输出日志，便于排查问题

      - name: 📝 暂存 s1.txt（稍后统一单提交推送）
        run: |
          set -euo pipefail
          # s1.txt 已在本步骤前由 update_nodes.py 生成；真正的提交/推送在流程末尾统一进行（方案A：单提交 + force-with-lease）
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') s1.txt 已就绪，等待末尾统一推送"

      # ========== 第三步：启动SubConverter服务（带状态检查） ==========
      - name: 🐳 启动SubConverter服务（极简稳定版）
        run: |
          set -euo pipefail
          # 清理残留容器
          docker rm -f ${{ env.SUB_CONTAINER_NAME }} 2>/dev/null || true

          # 启动容器（不做任何日志监听）
          docker run -d --name ${{ env.SUB_CONTAINER_NAME }} -p 25500:25500 tindy2013/subconverter:latest

          # 直接等待15秒（给足服务初始化时间，日志已证明15秒足够启动）
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 等待SubConverter服务初始化..."
          sleep 15

          # 轻量验证服务是否可访问（仅做2次重试，失败也输出日志但不强制退出）
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 验证SubConverter服务可用性..."
          for i in {1..2}; do
            if curl -s -I http://localhost:25500/sub | grep -q "200 OK"; then
              echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') SubConverter服务就绪 ✅"
              exit 0
            fi
            echo "[WARN] 第$i次验证失败，3秒后重试..."
            sleep 3
          done

          # 即使验证失败，也只告警并继续（服务实际已启动，curl验证可能因网络小波动失败）
          echo "[WARN] $(date +'%Y-%m-%d %H:%M:%S') SubConverter服务curl验证未通过，但容器已启动，继续执行后续步骤"
          docker logs ${{ env.SUB_CONTAINER_NAME }} | tail -20  # 输出最后20行日志备查

      # ========== 第四步：转换V2订阅为Clash配置（仅使用远程订阅链接） ==========
      - name: 🔄 转换V2订阅为Clash配置（仅远程链接）
        run: |
          set -euo pipefail
          # 定义订阅地址（仅保留远程链接，移除本地file://路径）
          # 注意：请替换成你实际的远程订阅链接
          V2_URL="https://raw.githubusercontent.com/1013608955/${{ github.event.repository.name }}/main/s.txt"
          # 原本地s1.txt改为远程链接（对应仓库中刚推送的s1.txt）
          V2_URL1="https://raw.githubusercontent.com/1013608955/${{ github.event.repository.name }}/main/s1.txt"
          V2_URL2="https://raw.githubusercontent.com/1013608955/${{ github.event.repository.name }}/main/s2.txt"

          # 验证订阅地址（移除本地file://协议的特殊处理）
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 开始验证订阅地址..."
          validate_url() {
            local url=$1
            local retry=3
            for ((i=1; i<=retry; i++)); do
              # 仅验证远程地址状态码
              status_code=$(curl -s --head "$url" -L | grep -i "^http" | awk '{print $2}')
              if [ "$status_code" = "200" ]; then
                echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') ✅ $url 地址有效（状态码：$status_code）"
                return 0
              fi
              echo "[WARN] $(date +'%Y-%m-%d %H:%M:%S') $url 地址无效（状态码：$status_code），第$i次重试..."
              sleep 2
              if [ $i -eq $retry ]; then
                echo "[ERROR] $(date +'%Y-%m-%d %H:%M:%S') ❌ $url 地址验证失败，终止流程"
                return 1
              fi
            done
          }
          # 批量验证订阅地址
          for url in "$V2_URL" "$V2_URL1" "$V2_URL2"; do
            validate_url "$url" || exit 1
          done

          # 生成Clash配置文件（带超时+重试，非空检查）
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') 开始生成Clash配置文件..."
          generate_config() {
            local url=$1
            local output=$2
            # 调用SubConverter生成配置
            curl --max-time 30 --retry 3 \
              "http://localhost:25500/sub?target=clash&url=$url&group=Auto&interval=60&url_test=https://cp.cloudflare.com/generate_204" \
              -o "$output"
            # 检查配置文件是否非空
            if [ "$(stat -c%s "$output")" -eq 0 ]; then
              echo "[ERROR] $(date +'%Y-%m-%d %H:%M:%S') ❌ $output 内容为空，转换失败"
              exit 1
            fi
            echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') ✅ $output 生成成功，大小：$(du -h "$output" | awk '{print $1}')"
          }
          # 批量生成配置文件
          generate_config "$V2_URL" "./s-clash.yaml"
          generate_config "$V2_URL1" "./s1-clash.yaml"
          generate_config "$V2_URL2" "./s2-clash.yaml"

      # ========== 第五步：统一单提交推送（方案A：amend + force-with-lease，避免历史膨胀） ==========
      - name: 📤 统一推送生成的订阅文件（单提交）
        run: |
          set -euo pipefail
          # 配置Git用户
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"

          # 暂存本次运行产生的全部生成物（s1.txt 来自节点更新步骤，其余来自 SubConverter）
          git add s1.txt s-clash.yaml s1-clash.yaml s2-clash.yaml

          # 仅当确有变更时才改写单条提交并推送；force-with-lease 避免覆盖他人推送
          if git diff --cached --quiet; then
            echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') ℹ️  生成物无变更，跳过推送"
          else
            git commit --amend --no-edit
            git push --force-with-lease origin ${{ github.ref_name }}
            echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') ✅ 生成物已以单提交方式更新并推送"
          fi

      # ========== 收尾：强制清理容器（无论流程是否失败） ==========
      - name: 🧹 清理SubConverter容器
        if: always()  # 所有情况都执行清理，避免资源泄漏
        run: |
          docker rm -f ${{ env.SUB_CONTAINER_NAME }} 2>/dev/null || true
          echo "[INFO] $(date +'%Y-%m-%d %H:%M:%S') SubConverter容器已清理完成"
