name: check-devstation
# ============================================================================
# 一次性诊断（B 路线一票否决项验证，2026-10-15）
#
# 目的：旧「开发者空间·容器版」将于 2026-10-30 下线，需确认接班产品
#      「AI 开发者空间（DevStation）」能否被 hdspace CLI 接管——
#      即 `hdspace devenv list` 里除了旧的两个 DevEnvC 容器，
#      是否还能看到 AI 开发者空间的环境。
#
# 本 workflow 是**只读诊断**：仅配置 AK/SK 并执行 list，不做任何变更，
# 不开关机、不推送。验证完即可删除本文件。
#
# 两个已踩过的坑（勿删）：
#   ① 必须 chmod +x tools/bin/hdspace-linux —— git 中是 644，
#      config_hds.py 直接 execvp 它会报 PermissionError [Errno 13]。
#   ② gnome-keyring 的 SystemPrompter 是**概率性启动失败**（hds-cycle 也会遇到），
#      故此处以「list 能否真列出环境」为成功判据，最多重试 3 次。
# ============================================================================
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: 准备（赋予可执行权限）
        run: chmod +x tools/bin/hdspace-linux tools/config_hds.py

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0 \
            python3-secretstorage xvfb xdotool openbox

      - name: 写入凭据脚本（复用 hds-cycle [1] 的 gcr 弹窗自动应答）
        run: |
          cat > /tmp/cred_setup.sh <<'OUTER'
          #!/bin/bash
          export DISPLAY=:99
          dbus-run-session -- bash -exs <<'SESSION'
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          sleep 2
          mkdir -p ~/.cache ~/.local/share/keyrings
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --unlock)" || true
          eval "$(printf 'ci-unlock' | gnome-keyring-daemon --start)" || true
          (
            for i in $(seq 1 200); do
              WINS=$( { xdotool search --onlyvisible --name 'gcr' 2>/dev/null;
                        xdotool search --onlyvisible --class 'Gcr' 2>/dev/null; } | sort -u)
              if [ -z "$WINS" ]; then sleep 1; continue; fi
              echo "[autoresponder] 命中 gcr 窗口: $WINS" >&2
              for W in $WINS; do
                eval "$(xdotool getwindowgeometry --shell "$W" 2>/dev/null)"
                xdotool mousemove --window "$W" $((WIDTH/2)) $((HEIGHT/2)) click 1 2>/dev/null
                xdotool windowfocus "$W" 2>/dev/null
                sleep 0.5
                xdotool type --delay 80 'ci-unlock'
                xdotool key Tab
                xdotool type --delay 80 'ci-unlock'
                xdotool key Return
                sleep 3
              done
              sleep 1
            done
          ) &
          AR=$!
          timeout 170 python3 tools/config_hds.py
          kill $AR 2>/dev/null
          SESSION
          OUTER
          chmod +x /tmp/cred_setup.sh
          echo "[prep] 凭据脚本已就绪"

      - name: 决定性验证 —— devenv list 能否看到 AI 开发者空间环境（最多 3 次）
        run: |
          echo "===== hdspace 版本 ====="
          ./tools/bin/hdspace-linux version
          echo
          OK=0
          for attempt in 1 2 3; do
            echo "[cred] ===== 第 $attempt/3 次尝试配置凭据 ====="
            set +e
            bash /tmp/cred_setup.sh 2>&1 | tail -20
            echo
            echo "[cred] ===== 第 $attempt/3 次 devenv list ====="
            ./tools/bin/hdspace-linux devenv list > /tmp/list.txt 2>&1
            RC=$?
            cat /tmp/list.txt
            echo "[cred] list rc=$RC"
            if grep -qE "[0-9a-f]{32}" /tmp/list.txt; then
              echo "[cred] ✓ 凭据可用，list 成功列出环境"
              OK=1
              break
            fi
            echo "[cred] ✗ list 未列出任何环境（凭据/账号侧问题），20s 后重试"
            sleep 20
          done
          echo
          echo "===== 最终判定 ====="
          if [ "$OK" = "1" ]; then
            echo "【list 成功】共 $(grep -oE '[0-9a-f]{32}' /tmp/list.txt | sort -u | wc -l) 个环境实例："
            grep -oE '[0-9a-f]{32}' /tmp/list.txt | sort -u | while read -r id; do
              echo "--- $id ---"
              grep -F "$id" /tmp/list.txt
            done
            echo
            echo ">>> 判读要点：若除两个旧 DevEnvC 容器外还有第三个实例，"
            echo ">>> 说明 AI 开发者空间已被 hdspace CLI 接管 → 路线 B 成立。"
          else
            echo "【3 次均失败】凭据/账号侧问题，未能进入环境比对。"
            echo ">>> 这是 runner 环境问题，不是 B 路线的结论 ——"
            echo ">>> 需要换一次 runner 或本地配置好凭据后再验。"
          fi
