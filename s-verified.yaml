  - 119.29.29.29
  - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
