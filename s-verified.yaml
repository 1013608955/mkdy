  - KR韩国(mibei77.com 米贝节点分享)
  - 🇺🇸_美国_237
  - 🇸🇬_SG_新加坡
  - 🇺🇸_美国_340
  - 🇪🇸_ES_西班牙
  url: http://www.gstatic.com/generate_204
  interval: 86400
- name: 故障转移
  type: fallback
