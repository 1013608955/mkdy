# s-verified.yaml — 仅含中国出口(FC)验证通过的节点 + clash_template 规则模版
# 来源 verified.json: 16 个 ok → 匹配 14（漂移跳过 2）
mode: rule
log-level: info
mixed-port: 7890
allow-lan: true
bind-address: '*'
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 114.114.114.114
  fallback:
  - 1.1.1.1
  - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
proxy-groups:
- name: 自由航线
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 🇮🇳_IN_印度
  - 泰国(mibei77.com 米贝节点分享)
  - NL荷兰(mibei77.com 米贝节点分享)
  - 🇬🇧_GB_英国
  - 🇺🇸_美国_300
  - 🇺🇸_美国_301
  - 🇺🇸_美国_334
  - '[peasoft/NoMoreWalls]🇭🇰HK_16|2.7MB/s'
  - 🇳🇱_NL_荷兰->🇹🇭_TH_泰国
  - KR韩国(mibei77.com 米贝节点分享)
  - 🇺🇸_美国_237
  - 🇸🇬_SG_新加坡
  - 🇺🇸_美国_340
  - 🇪🇸_ES_西班牙
- name: 自动选择
  type: url-test
  proxies:
